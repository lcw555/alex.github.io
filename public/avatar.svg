<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fdf8ef"/>
      <stop offset="100%" stop-color="#efe1cc"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.24" r="0.6">
      <stop offset="0%" stop-color="#c9784f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9784f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#card)"/>
  <rect width="512" height="512" fill="url(#sun)"/>

  <!-- 极淡的横线，和 banner 呼应 -->
  <g stroke="#b07a55" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="0" y1="140" x2="512" y2="140"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="372" x2="512" y2="372"/>
  </g>

  <!-- 衬线字母，而不是无衬线粗体 -->
  <text x="50%" y="50%" dy="0.34em" text-anchor="middle"
        font-family="Georgia, 'Songti SC', 'Times New Roman', serif"
        font-size="188" font-weight="400" fill="#a05f3c">L</text>

  <!-- 内描边，收住边缘 -->
  <rect x="0.75" y="0.75" width="510.5" height="510.5" fill="none"
        stroke="#b07a55" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
